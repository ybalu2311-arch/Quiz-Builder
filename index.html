<!DOCTYPE html>
<html>
<head>
    <title>Quiz Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Quiz Builder</h1></header>

<div id="loginPage" class="box">
    <h2>Login</h2>
    <input id="loginUser" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="show('signupPage')">Student Signup</button>
</div>

<div id="signupPage" class="box hide">
    <h2>Student Signup</h2>
    <input id="studentId" placeholder="Student ID">
    <input id="studentName" placeholder="Student Name">
    <input id="signUser" placeholder="Username">
    <input id="signPass" type="password" placeholder="Password">
    <button onclick="signup()">Create Account</button>
    <button onclick="show('loginPage')">Back to Login</button>
</div>

<div id="adminPage" class="box hide">
    <h2>Admin Module</h2>

    <input id="quizTitle" placeholder="Quiz Title">
    <input id="quizTime" type="number" placeholder="Time in Minutes">

    <select id="type" onchange="changeType()">
        <option value="mcq">Multiple Choice</option>
        <option value="tf">True / False</option>
        <option value="fill">Fill in the Blank</option>
    </select>

    <input id="question" placeholder="Enter Question">
    <input id="marks" type="number" placeholder="Marks">

    <div id="mcqFields">
        <input id="op1" placeholder="Option A">
        <input id="op2" placeholder="Option B">
        <input id="op3" placeholder="Option C">
        <input id="op4" placeholder="Option D">
        <input id="correct" placeholder="Correct Answer A/B/C/D">
    </div>

    <div id="tfFields" class="hide">
        <select id="tfAnswer">
            <option>True</option>
            <option>False</option>
        </select>
    </div>

    <div id="fillFields" class="hide">
        <input id="fillAnswer" placeholder="Correct Answer">
    </div>

    <button onclick="addQuestion()">Add Question</button>
    <button onclick="saveQuiz()">Save Quiz</button>
    <button onclick="showStudentModule()">Go To Student Module</button>

    <h3>Added Questions</h3>
    <div id="questionList"></div>

    <h3>Student Result History</h3>
    <div id="history"></div>

    <button onclick="logout()">Logout</button>
</div>

<div id="userPage" class="box hide">
    <h2>Student Module</h2>

    <input id="writeId" placeholder="Student ID">
    <input id="writeName" placeholder="Student Name">

    <h3>Available Quizzes</h3>
    <div id="quizList"></div>

    <h3>My Results</h3>
    <div id="myResults"></div>

    <button onclick="logout()">Logout</button>
</div>

<div id="quizPage" class="box hide">
    <div class="top">
        <h2 id="playTitle"></h2>
        <b id="timer">Time: 00:00</b>
    </div>

    <p id="questionNumber"></p>
    <h3 id="playQuestion"></h3>
    <p id="questionMarks"></p>

    <div id="playOptions"></div>

    <input id="fillInput" class="hide" placeholder="Write your answer">

    <button onclick="submitAnswer()">Next</button>
</div>

<script src="script.js"></script>
</body>
</html>
